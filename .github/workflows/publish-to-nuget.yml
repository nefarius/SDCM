name: Publish Nuget Package

on:
  push:
    tags:
      - v*

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # required for NuGet trusted publishing OIDC exchange
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore SurfaceDevCenterManager.slnx

      - name: Build
        run: dotnet build SurfaceDevCenterManager.slnx -c Release --no-restore

      - name: Test
        run: dotnet test SurfaceDevCenterManager.slnx -c Release --no-build --verbosity normal

      - name: Modify README.md for NuGet
        run: |
          sed -i 's/# <img[^>]*>/# /' README.md

      - name: Pack
        run: dotnet pack src/SurfaceDevCenterManager/SurfaceDevCenterManager.csproj -c Release -o ./artifacts/nuget

      - name: Verify package version matches tag
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          shopt -s nullglob
          nupkgs=(./artifacts/nuget/Nefarius.Tools.SDCM.*.nupkg)
          if [ ${#nupkgs[@]} -ne 1 ]; then
            echo "ERROR: expected exactly one nupkg, found ${#nupkgs[@]}"
            ls -la ./artifacts/nuget || true
            exit 1
          fi
          name=$(basename "${nupkgs[0]}" .nupkg)
          version="${name#Nefarius.Tools.SDCM.}"
          echo "Tag version: $TAG"
          echo "Package version: $version"
          if [ "$version" != "$TAG" ]; then
            echo "ERROR: packed version '$version' does not match tag '$TAG'"
            exit 1
          fi

      - name: Verify packages embed README
        run: |
          set -euo pipefail
          shopt -s nullglob
          nupkgs=(./artifacts/nuget/*.nupkg)
          if [ ${#nupkgs[@]} -eq 0 ]; then
            echo "ERROR: no nupkg files under ./artifacts/nuget"
            exit 1
          fi
          for nupkg in "${nupkgs[@]}"; do
            echo "Inspecting $nupkg"
            tmp=$(mktemp -d)
            unzip -q "$nupkg" -d "$tmp"
            test -f "$tmp/README.md" || { echo "ERROR: README.md missing from nupkg root: $nupkg"; exit 1; }
            grep -q '<readme>README.md</readme>' "$tmp"/*.nuspec \
              || { echo "ERROR: nuspec missing <readme>README.md</readme> in $nupkg"; cat "$tmp"/*.nuspec; exit 1; }
            echo "Embedded README OK in $(basename "$nupkg") ($(wc -c < "$tmp/README.md") bytes)"
            rm -rf "$tmp"
          done

      - name: NuGet login (OIDC → short-lived API key)
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: Nefarius

      - name: Push to NuGet.org
        run: dotnet nuget push ./artifacts/nuget/*.nupkg --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Upload packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nuget-packages
          path: ./artifacts/nuget/*

  release:
    runs-on: ubuntu-latest
    needs: publish
    permissions:
      contents: write
    steps:
      - name: Resolve version
        id: ver
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $VERSION"

      - name: Download packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nuget-packages
          path: ./artifacts/nuget

      - name: Create GitHub Release
        uses: softprops/action-gh-release@e598afbe1493e6b1bafb1f389cabb956eab91231 # v3.0.3
        with:
          generate_release_notes: true
          files: |
            artifacts/nuget/Nefarius.Tools.SDCM.${{ steps.ver.outputs.version }}.nupkg
            artifacts/nuget/Nefarius.Tools.SDCM.${{ steps.ver.outputs.version }}.snupkg
